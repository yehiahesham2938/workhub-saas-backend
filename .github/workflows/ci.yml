# Bonus 6: CI validation
name: CI

on:
  push:
    branches: [main, phase-3-enterprise]
  pull_request:
    branches: [main, phase-3-enterprise]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build, test, and package
        run: mvn -B verify
