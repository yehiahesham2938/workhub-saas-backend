server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: workhub-saas-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/workhub}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    hikari:
      initialization-fail-timeout: -1
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 500ms
          multiplier: 2
          max-attempts: 3
          max-interval: 5000ms
        default-requeue-rejected: false
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  cache:
    type: caffeine

logging:
  level:
    org.hibernate.SQL: info
    com.workhub.business: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] cid=%X{correlationId:-} tenant=%X{tenantId:-} job=%X{jobId:-} %logger{36} - %msg%n"

jwt:
  secret: ${JWT_SECRET:VGhpcy1pcy1ub3QtMy1yZWFsbHktYS0yNTYtYml0LXNlY3JldC1zdHJpbmchISE=}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      group:
        readiness:
          include: readinessState,db,rabbitQueues
        liveness:
          include: livenessState
  metrics:
    tags:
      application: ${spring.application.name}
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: true

workhub:
  quotas:
    plans:
      FREE:
        max-workspaces: 2
        max-projects: 5
        max-open-jobs: 3
        max-tasks-per-project: 10
      STARTER:
        max-workspaces: 5
        max-projects: 20
        max-open-jobs: 10
        max-tasks-per-project: 50
      PRO:
        max-workspaces: 20
        max-projects: 100
        max-open-jobs: 50
        max-tasks-per-project: 200
      ENTERPRISE:
        max-workspaces: 100
        max-projects: 500
        max-open-jobs: 200
        max-tasks-per-project: 1000

info:
  app:
    name: workhub-saas-backend
    phase: phase3-enterprise
    description: Multi-tenant SaaS backend with audit, saga, quotas, and caching
